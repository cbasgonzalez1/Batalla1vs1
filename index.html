<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0D14">
<!-- Va en linea a proposito: sin icono el navegador pide /favicon.ico, se lleva
     un 404 y ese 404 aparecia en las verificaciones como si fuera un fallo del
     juego. Es un obus con su trazadora. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0D14'/%3E%3Cpath d='M13 9h7l5 7-5 7h-7z' fill='%23FF7A1A'/%3E%3Crect x='5' y='14' width='8' height='4' rx='2' fill='%234FD8FF'/%3E%3C/svg%3E">
<title>Artillería 1v1 — prototipo</title>
<style>
  :root{
    --ground:#0A0D14;
    --plate:#111823;
    --plate-hi:#18202D;
    --line:#26303F;
    --ink:#EEF3F9;
    --mono:#7F8DA0;
    --trazadora:#FF7A1A;
    --fosforo:#4FD8FF;
    --danger:#FF3B4E;
    --f-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--ground);
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:var(--f-mono);
    -webkit-font-smoothing:antialiased;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  #stage{
    position:relative;
    height:100dvh;
    aspect-ratio: 1080 / 1920;
    max-width:100vw;
    width:auto;
    background:#0A0D14;
    overflow:hidden;
    touch-action:none;
    cursor:crosshair;
    /* --u = 1 px del diseno a 1080 de ancho, EN PIXELES. Tiene que llevar
       unidad: calc(var(--u)*28) sobre un numero pelado da un numero sin
       unidad y el navegador descarta la declaracion entera. */
    --u: 0.42px;
  }
  @media (max-aspect-ratio: 1080/1920){
    #stage{ width:100vw; height:auto; }
  }
  /* SOLO el lienzo de WebGL, que cuelga directo de #stage. Con `#stage canvas`
     esta regla alcanzaba tambien a #franja —y le ganaba por especificidad, id +
     tipo contra id pelado—, asi que la franja del terreno se estiraba a
     pantalla completa y pintaba el perfil borroso encima del cielo. */
  #stage > canvas{ display:block; width:100%; height:100%; }

  .hud{ position:absolute; inset:0; pointer-events:none; }
  .hud > *{ position:absolute; }

  /* ─────────────────────────────── marcadores de vida ───────────────── */
  #top{
    top:0; left:0; right:0;
    display:flex; align-items:flex-start; gap:calc(var(--u)*16);
    padding:calc(var(--u)*26) calc(var(--u)*28);
  }
  .player{ flex:1 1 0; min-width:0; }
  .player.b{ text-align:right; }
  .pname{
    font-size:calc(var(--u)*22); letter-spacing:.14em; text-transform:uppercase;
    color:var(--mono); display:flex; align-items:center; gap:calc(var(--u)*10);
    text-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(4,7,12,.9);
  }
  .player.b .pname{ justify-content:flex-end; }
  .pname b{ font-weight:700; }
  .player.a .pname b{ color:var(--trazadora); }
  .player.b .pname b{ color:var(--fosforo); }
  .pname .hpnum{ color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }

  .bar{
    margin-top:calc(var(--u)*8);
    height:calc(var(--u)*20);
    background:rgba(8,12,18,.78);
    border:1px solid var(--line);
    border-radius:calc(var(--u)*4);
    overflow:hidden; position:relative;
  }
  .bar .ghost{
    position:absolute; inset:0 auto 0 0; height:100%;
    background:var(--danger); opacity:.55; width:100%;
    /* ART.md §5: el fantasma espera 400 ms y luego baja en 260 ms con
       easeOutCubic. El retardo es lo que enseña CUANTO acabas de perder: sin
       el, las dos barras bajan a la vez y el golpe no se ve. */
    transition:width .26s cubic-bezier(.33,1,.68,1) .4s;
  }
  .bar .fill{
    position:absolute; inset:0 auto 0 0; height:100%; width:100%;
    border-radius:calc(var(--u)*3);
    transition:width .26s cubic-bezier(.33,1,.68,1);
  }
  .player.a .bar .fill{ background:linear-gradient(180deg,#FFA774,var(--trazadora) 45%,#C7401A); }
  .player.b .bar .fill{ background:linear-gradient(180deg,#7DEEFF,var(--fosforo) 45%,#0090B8); }
  .player.b .bar .ghost,
  .player.b .bar .fill{ inset:0 0 0 auto; }

  .charges{
    margin-top:calc(var(--u)*9); display:flex; gap:calc(var(--u)*7);
    font-size:calc(var(--u)*20); line-height:1;
  }
  .player.b .charges{ justify-content:flex-end; }
  .charges i{ font-style:normal; color:#2E3949; }
  .player.a .charges i.on{ color:var(--trazadora); }
  .player.b .charges i.on{ color:var(--fosforo); }

  /* La franja: el campo entero comprimido arriba del todo. Da topologia, no
     solucion de tiro — el muestreo es basto a proposito. */
  #franja{
    display:block; width:100%; height:calc(var(--u)*44);
    margin-bottom:calc(var(--u)*6);
    border-bottom:1px solid var(--line);
    opacity:.9;
  }

  /* Cada lado apila a los suyos: con tres por bando el marcador crece hacia
     abajo en vez de estrujar el ancho, que en vertical es lo escaso. */
  .lado{ display:flex; flex-direction:column; gap:calc(var(--u)*8); flex:1 1 0; min-width:0; }
  .lado#lado-b .player{ align-items:flex-end; }
  .lado .player{ display:flex; flex-direction:column; gap:calc(var(--u)*4); }
  .player.turno .pname{ color:var(--ink); }
  .player.turno .bar{ box-shadow:0 0 0 1px var(--trazadora); }
  .player.fuera{ opacity:.35; }

  #wind{
    flex:0 0 auto; text-align:center; padding-top:calc(var(--u)*4);
    font-size:calc(var(--u)*20); letter-spacing:.12em; text-transform:uppercase;
    color:var(--mono);
    text-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(4,7,12,.9);
  }
  #wind b{
    display:block; margin-top:calc(var(--u)*5);
    font-size:calc(var(--u)*26); color:var(--ink); font-weight:700;
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }

  /* El pronostico va en fantasma bajo el viento actual: se lee de un vistazo
     que el de ahora es solido y el de despues no ha pasado todavia. */
  #wind i{
    display:block; margin-top:calc(var(--u)*2); font-style:normal;
    font-size:calc(var(--u)*16); color:var(--mono); opacity:.55;
    font-variant-numeric:tabular-nums; letter-spacing:.04em;
  }

  /* Medio segundo en grande: cuanto fallaste y que construiste. A 88 unidades
     no ves tu impacto, asi que sin esto un fallo no enseña nada. */
  #lectura{
    position:absolute; left:0; right:0; top:38%;
    text-align:center; pointer-events:none;
    opacity:0; transform:translateY(calc(var(--u)*8));
    transition:opacity .18s ease-out, transform .18s ease-out;
  }
  #lectura.on{ opacity:1; transform:none; }
  #lectura b{
    display:block; font-size:calc(var(--u)*46); font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--ink);
    text-shadow:0 calc(var(--u)*3) calc(var(--u)*10) rgba(4,7,12,.95);
    font-variant-numeric:tabular-nums;
  }
  #lectura span{
    display:block; margin-top:calc(var(--u)*4);
    font-size:calc(var(--u)*22); letter-spacing:.1em; text-transform:uppercase;
    color:var(--fosforo); font-variant-numeric:tabular-nums;
    text-shadow:0 calc(var(--u)*2) calc(var(--u)*8) rgba(4,7,12,.9);
  }
  #lectura span.encima{ color:var(--ink); }

  /* El enlace del combate: discreto al lado de la revancha, porque no es lo
     que uno quiere pulsar justo despues de ganar. */
  #compartir{
    margin-top:calc(var(--u)*8); background:transparent;
    border:1px solid var(--line); color:var(--mono);
  }
  #compartir.hecho{ color:var(--trazadora); border-color:var(--trazadora); }


  /* ─────────────────────────────────────────────── sala ─────────────── */
  /* Ocupa la pantalla entera y tapa el juego: mientras se monta la partida
     no hay nada que mirar detras, y asi el codigo se lee de lejos cuando
     alguien lo esta dictando en voz alta. */
  #sala{
    position:absolute; inset:0; z-index:40;
    background:var(--ground);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u)*18); padding:calc(var(--u)*24);
    text-align:center;
  }
  #sala.on{ display:flex; }

  #sala h1{
    font-size:calc(var(--u)*30); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; color:var(--mono);
  }

  /* El codigo es lo unico que hay que leer en voz alta: va enorme y espaciado
     para que no se confunda una letra al dictarlo. */
  #s-codigo{
    font-size:calc(var(--u)*76); font-weight:700; letter-spacing:.22em;
    color:var(--ink); font-variant-numeric:tabular-nums;
    text-shadow:0 calc(var(--u)*4) calc(var(--u)*14) rgba(4,7,12,.95);
  }
  #s-codigo.vacio{ color:var(--line); }

  #sala .fila{ display:flex; gap:calc(var(--u)*10); flex-wrap:wrap; justify-content:center; }

  #sala input{
    width:calc(var(--u)*220); padding:calc(var(--u)*12) calc(var(--u)*14);
    background:var(--plate); border:1px solid var(--line); border-radius:calc(var(--u)*8);
    color:var(--ink); font-family:var(--f-mono); font-size:calc(var(--u)*26);
    letter-spacing:.18em; text-align:center; text-transform:uppercase;
  }
  #sala input:focus{ outline:none; border-color:var(--fosforo); }
  #sala input::placeholder{ color:var(--mono); letter-spacing:.1em; }

  #sala button{
    padding:calc(var(--u)*12) calc(var(--u)*20);
    background:var(--plate-hi); border:1px solid var(--line); border-radius:calc(var(--u)*8);
    color:var(--ink); font-family:var(--f-mono); font-size:calc(var(--u)*22);
    letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    transition:transform .12s cubic-bezier(.22,1,.36,1), border-color .12s;
  }
  #sala button:hover{ border-color:var(--mono); }
  #sala button:active{ transform:scale(.97); }
  #sala button.principal{ border-color:var(--trazadora); color:var(--trazadora); }
  #sala button.listo{ background:var(--trazadora); border-color:var(--trazadora); color:var(--ground); }
  #sala button:disabled{ opacity:.4; cursor:default; }

  /* Los dos bandos, uno frente a otro: se ve de un vistazo si falta gente en
     un lado antes de darle a listo. */
  #s-bandos{ display:flex; gap:calc(var(--u)*20); align-items:flex-start; }
  #s-bandos .bando{
    min-width:calc(var(--u)*200); padding:calc(var(--u)*14);
    background:var(--plate); border:1px solid var(--line); border-radius:calc(var(--u)*10);
  }
  #s-bandos .bando h2{
    font-size:calc(var(--u)*22); letter-spacing:.16em; text-transform:uppercase;
    color:var(--mono); margin-bottom:calc(var(--u)*10);
  }
  #s-bandos .bando.a h2{ color:var(--trazadora); }
  #s-bandos .bando.b h2{ color:var(--fosforo); }
  #s-bandos ul{ list-style:none; display:flex; flex-direction:column; gap:calc(var(--u)*6); }
  #s-bandos li{
    font-size:calc(var(--u)*22); color:var(--ink);
    display:flex; align-items:center; justify-content:space-between; gap:calc(var(--u)*8);
  }
  #s-bandos li .marca{ color:var(--mono); font-size:calc(var(--u)*18); }
  #s-bandos li.listo .marca{ color:var(--trazadora); }
  #s-bandos li.yo{ font-weight:700; }
  #s-bandos li.hueco{ color:var(--line); }

  #s-aviso{ font-size:calc(var(--u)*20); color:var(--danger); min-height:calc(var(--u)*24); }
  #s-pista{ font-size:calc(var(--u)*20); color:var(--mono); letter-spacing:.06em; }

  /* ─────────────────────────────────── lectura de tiro ──────────────── */
  #shotinfo{
    left:calc(var(--u)*28); bottom:calc(var(--u)*34);
    font-size:calc(var(--u)*21); letter-spacing:.12em; text-transform:uppercase;
    color:var(--mono); line-height:1.75;
    text-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(4,7,12,.9);
  }
  #shotinfo b{ color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; }

  /* ───────────────────────────────────── boton otear ────────────────── */
  #scout{
    right:calc(var(--u)*28); bottom:calc(var(--u)*30);
    width:calc(var(--u)*132); height:calc(var(--u)*132);
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, var(--plate-hi), var(--plate) 70%);
    border:1px solid var(--line);
    box-shadow:0 calc(var(--u)*6) calc(var(--u)*18) rgba(4,7,12,.6),
               inset 0 1px 0 rgba(255,255,255,.06);
    color:var(--mono);
    font-family:var(--f-mono); font-size:calc(var(--u)*19); letter-spacing:.14em;
    text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:calc(var(--u)*4);
    pointer-events:auto; cursor:pointer;
    transition:transform .14s cubic-bezier(.34,1.56,.64,1), color .14s, border-color .14s;
  }
  #scout .eye{ font-size:calc(var(--u)*34); line-height:1; }
  #scout:active, #scout.on{ transform:scale(.94); color:var(--ink); border-color:#3C4B60; }
  #scout:focus-visible{ outline:calc(var(--u)*3) solid var(--fosforo); outline-offset:calc(var(--u)*4); }

  /* ──────────────────────────────── panel de reaccion ───────────────── */
  #reaction{
    left:50%; bottom:calc(var(--u)*200); transform:translate(-50%, calc(var(--u)*30));
    width:calc(var(--u)*640);
    background:linear-gradient(180deg, rgba(24,32,45,.97), rgba(15,21,30,.97));
    border:1px solid #3A4759;
    border-radius:calc(var(--u)*16);
    padding:calc(var(--u)*22) calc(var(--u)*22) calc(var(--u)*24);
    box-shadow:0 calc(var(--u)*18) calc(var(--u)*44) rgba(2,5,10,.75);
    opacity:0; pointer-events:none;
    transition:opacity .12s ease, transform .22s cubic-bezier(.34,1.56,.64,1);
  }
  #reaction.on{ opacity:1; transform:translate(-50%, 0); pointer-events:auto; }
  #reaction .head{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:calc(var(--u)*21); letter-spacing:.16em; text-transform:uppercase;
    color:var(--danger);
  }
  #reaction .head span{ color:var(--mono); font-variant-numeric:tabular-nums; }
  #rtimer{
    margin:calc(var(--u)*12) 0 calc(var(--u)*18);
    height:calc(var(--u)*8); background:rgba(8,12,18,.9);
    border-radius:calc(var(--u)*4); overflow:hidden;
  }
  #rtimer i{ display:block; height:100%; width:100%; background:var(--danger); }
  #reaction .acts{ display:grid; grid-template-columns:1fr 1fr; gap:calc(var(--u)*14); }
  .ract{
    pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg, var(--plate-hi), var(--plate));
    border:1px solid var(--line);
    border-radius:calc(var(--u)*12);
    padding:calc(var(--u)*18) calc(var(--u)*10) calc(var(--u)*16);
    color:var(--ink);
    font-family:var(--f-mono); font-size:calc(var(--u)*24); letter-spacing:.12em;
    text-transform:uppercase;
    display:flex; flex-direction:column; align-items:center; gap:calc(var(--u)*8);
    transition:transform .12s cubic-bezier(.34,1.56,.64,1), border-color .12s;
  }
  .ract .ico{ font-size:calc(var(--u)*38); line-height:1; }
  .ract:active{ transform:scale(.95); border-color:#4A5B72; }
  .ract:focus-visible{ outline:calc(var(--u)*3) solid var(--fosforo); outline-offset:calc(var(--u)*3); }
  .ract[disabled]{ opacity:.32; pointer-events:none; }

  /* ──────────────────────────────────────── victoria ────────────────── */
  #victory{
    inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:calc(var(--u)*10);
    background:radial-gradient(120% 70% at 50% 45%, rgba(10,13,20,.5), rgba(10,13,20,.93));
    opacity:0; pointer-events:none; transition:opacity .45s ease;
  }
  #victory.on{ opacity:1; pointer-events:auto; }
  #victory .kicker{
    font-size:calc(var(--u)*22); letter-spacing:.3em; text-transform:uppercase; color:var(--mono);
  }
  #victory .who{
    font-size:calc(var(--u)*104); font-weight:900; letter-spacing:-.02em; line-height:1;
    text-transform:uppercase;
  }
  #victory .who.a{ color:var(--trazadora); }
  #victory .who.b{ color:var(--fosforo); }
  #victory .stats{
    margin-top:calc(var(--u)*6); font-size:calc(var(--u)*22); color:var(--mono);
    letter-spacing:.1em; text-transform:uppercase;
  }
  #again{
    margin-top:calc(var(--u)*32); pointer-events:auto; cursor:pointer;
    background:linear-gradient(180deg, var(--plate-hi), var(--plate));
    border:1px solid #3A4759; border-radius:calc(var(--u)*12);
    padding:calc(var(--u)*20) calc(var(--u)*44);
    color:var(--ink); font-family:var(--f-mono);
    font-size:calc(var(--u)*26); letter-spacing:.18em; text-transform:uppercase;
    transition:transform .14s cubic-bezier(.34,1.56,.64,1);
  }
  #again:active{ transform:scale(.95); }
  #again:focus-visible{ outline:calc(var(--u)*3) solid var(--fosforo); outline-offset:calc(var(--u)*4); }

  #hint{
    left:0; right:0; bottom:calc(var(--u)*150); text-align:center;
    font-size:calc(var(--u)*21); letter-spacing:.14em; text-transform:uppercase;
    color:var(--mono);
    text-shadow:0 calc(var(--u)*2) calc(var(--u)*6) rgba(4,7,12,.9);
    transition:opacity .4s ease;
  }
  #hint.gone{ opacity:0; }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="hud">

      <canvas id="franja" aria-hidden="true"></canvas>

      <div id="top">
        <!-- Los marcadores los monta hud.montarMarcadores() a partir del
             plantel: pueden ser dos o seis, y en el HTML no cabe suponerlo. -->
        <div class="lado" id="lado-a"></div>

        <div id="wind"><span data-i18n="viento">Viento</span><b id="r-wind">0.0</b><i id="r-wind-next" title=""></i></div>

        <div class="lado" id="lado-b"></div>
      </div>

      <div id="shotinfo">
        <div><span data-i18n="turno">Turno</span> <b id="r-turn">A</b></div>
        <div><span data-i18n="angulo">Ángulo</span> <b id="r-angle">45°</b></div>
        <div><span data-i18n="potencia">Potencia</span> <b id="r-power">55%</b></div>
      </div>

      <button id="scout" type="button" data-i18n-aria="otearAria">
        <span class="eye" aria-hidden="true">◎</span>
        <span data-i18n="otear">Otear</span>
      </button>

      <div id="reaction" role="group" data-i18n-aria="reaccionAria">
        <div class="head">⚡ <span data-i18n="reaccion">Reacción</span> <span id="rsecs">0.90s</span></div>
        <div id="rtimer"><i id="rbar"></i></div>
        <div class="acts">
          <button class="ract" id="r-shield" type="button">
            <span class="ico" aria-hidden="true">◈</span>
            <span data-i18n="escudo">Escudo</span>
          </button>
          <button class="ract" id="r-hop" type="button">
            <span class="ico" aria-hidden="true">⤴</span>
            <span data-i18n="salto">Salto</span>
          </button>
        </div>
      </div>

      <div id="victory">
        <div class="kicker" data-i18n="objetivoDestruido">Objetivo destruido</div>
        <div class="who" id="v-who">Gana A</div>
        <div class="stats" id="v-stats">—</div>
        <button id="again" type="button" data-i18n="revancha">Revancha</button>
        <button id="compartir" type="button" data-i18n="compartir">Copiar enlace</button>
      </div>

      <div id="lectura"><b id="l-fallo"></b><span id="l-arena"></span></div>

      <div id="hint" data-i18n="pista">Arrastra hacia atrás y suelta</div>
    </div>
  </div>

  <div id="sala">
    <h1 data-i18n="salaTitulo">Jugar con amigos</h1>

    <div id="s-entrada">
      <div class="fila">
        <input id="s-nombre" maxlength="16" placeholder="Tu nombre" autocomplete="nickname" spellcheck="false" style="text-transform:none; letter-spacing:.06em">
      </div>
      <div class="fila" style="margin-top:calc(var(--u)*14)">
        <button id="s-crear" class="principal" type="button" data-i18n="crearSala">Crear sala</button>
      </div>
      <div class="fila" style="margin-top:calc(var(--u)*14)">
        <input id="s-codigo-input" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
        <button id="s-unir" type="button" data-i18n="unirse">Entrar</button>
      </div>
    </div>

    <div id="s-dentro" hidden>
      <div id="s-codigo" class="vacio">····</div>
